[package]
name = "wafer-cart"
version = "0.1.0"
edition = "2024"

[features]
default = []
dora = ["dep:dora-node-api", "dep:eyre"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dora-node-api = { version = "=1.1.0", optional = true }
eyre = { version = "0.6", optional = true }

[[bin]]
name = "telemetry-node"
required-features = ["dora"]

[[bin]]
name = "planning-demo"
required-features = ["dora"]
